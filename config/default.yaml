# eval-agent default configuration. CLI flags override these values.

judge:
  # Default judge: gemini-3.5-flash (stable, free-tier ~150 RPM,
  # ~10× cheaper than Pro). Strong enough for the 5-field structured
  # verdict this agent emits. Override per-run with `--judge <id>`:
  #
  #   --judge gemini-3.1-pro-preview   # higher-quality reasoning, ~10 RPM
  #   --judge gemini-2.5-pro           # mature Pro alternative
  #   --judge gemini-3-flash           # Flash preview variant
  #
  # The verdict cache key includes the judge id, so switching judges
  # invalidates the cache cleanly — no cross-judge contamination.
  id: "gemini-3.5-flash"
  endpoint: "https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
  thinking_level: "low"          # "low" | "high" — keep CoT brief for structured tasks
  max_output_tokens: 4096
  temperature: 0.0
  top_p: 0.95

rate_limit:
  # gemini-3.5-flash free tier sustains ~150 RPM. We default to 60 RPM,
  # a safe sub-quota number that finishes 162 candidates in ~3 minutes
  # while leaving headroom for bursty cache misses. For Pro models
  # (3.1 Pro Preview, 2.5 Pro) pass `--rpm 25` or lower.
  rpm: 60
  parallel: 4                    # worker pool size — small to keep RPM honest
  max_retries: 6
  retry_base_seconds: 5

threshold:
  default: 0.85                  # auto-approve gate; entities below are skipped
  per_evaluator:
    marc500_colophon: 0.85       # raise above the per-fold 0.45 to reduce false-positive rate
    genre_classifier: 0.85       # raise above 0.65 default

self_verify:
  sample_rate: 0.05              # 5% of verdicts re-judged at the end of each run
  agreement_floor: 0.95          # below this, the run is flagged as a self-verify regression

passes_floor:
  default: 0.80                  # precision floor for a feature to be considered passing
  per_evaluator:
    person_ner: 0.70             # role-classification is hard; lower bar
    marc500_colophon: 0.75       # tighter bar because of known precision issues
